[project]
name = "ragbench"
version = "0.1.0"
description = "Cheap, reproducible RAG evaluation: retrieval, answer quality, latency and cost"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2.13",
    "fastembed>=0.7",
    "numpy>=1.26",
    "openai>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
